<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geocache Field Puzzle</title>
<style>
  :root{
    --green:#4A752C;
    --green-dark:#395a21;
    --brown:#8B5E3C;
    --bg:#F5F3EE;
    --text:#1C1C1C;
    --danger:#A33;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--green);
    color:#fff;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  .screen{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    animation:fadeIn .35s ease;
  }
  .hidden{display:none !important;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .lang-title{
    font-size:1.6rem;
    font-weight:700;
    color:#fff;
    text-align:center;
    margin-top:40px;
  }
  .lang-btn{
    width:100%;
    padding:18px;
    font-size:1.2rem;
    font-weight:700;
    border:none;
    border-radius:12px;
    background:#fff;
    color:var(--green-dark);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .lang-btn:active{background:var(--bg);}
  .flag{font-size:1.4rem;}

  .instruction{
    font-size:1.1rem;
    line-height:1.4;
    text-align:center;
    background:#fff;
    border:2px solid var(--green-dark);
    border-radius:12px;
    padding:12px 14px;
    width:100%;
    color:var(--text);
  }
  .instruction b{color:var(--green-dark);}

  .timer{
    font-size:2.6rem;
    font-weight:800;
    color:var(--green-dark);
    background:#fff;
    border:3px solid #fff;
    border-radius:14px;
    padding:6px 28px;
    letter-spacing:2px;
  }
  .timer.warning{color:var(--danger);border-color:var(--danger);}

  .camera-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    border:3px solid #fff;
  }
  video{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  canvas#snap{display:none;}

  .status-pill{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:6px 14px;
    border-radius:20px;
    font-size:.85rem;
    font-weight:600;
    white-space:nowrap;
    transition:background .3s;
  }
  .status-pill.scanning{background:rgba(74,117,44,.85);}
  .status-pill.sending{background:rgba(0,70,160,.75);}

  /* Scan button */
  .scan-btn{
    width:100%;
    padding:15px;
    font-size:1.15rem;
    font-weight:700;
    border:none;
    border-radius:12px;
    background:#fff;
    color:var(--green-dark);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .scan-btn:disabled{opacity:.5;cursor:not-allowed;}
  .scan-btn:active:not(:disabled){background:var(--bg);}

  .manual-btn{
    background:none;
    border:none;
    color:#fff;
    text-decoration:underline;
    font-size:.9rem;
    cursor:pointer;
    margin-top:4px;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay-card{
    background:#fff;
    border-radius:16px;
    padding:28px 22px;
    text-align:center;
    max-width:420px;
    width:100%;
    box-shadow:0 6px 24px rgba(0,0,0,.25);
  }
  .overlay-card h2{
    color:var(--green-dark);
    font-size:1.6rem;
    margin-bottom:10px;
  }
  .overlay-card.loss h2{color:var(--danger);}
  .coords{
    font-size:1.3rem;
    font-weight:800;
    background:var(--bg);
    border:2px dashed var(--green);
    border-radius:10px;
    padding:14px;
    margin:10px 0;
    word-break:break-word;
    color:var(--text);
    letter-spacing:1px;
  }
  .stage-dot{
    width:18px;height:18px;border-radius:50%;
    background:rgba(255,255,255,0.35);
    border:2px solid #fff;
    transition:background .3s;
  }
  .stage-dot.done{background:#fff;}
  .stage-dot.active{background:rgba(255,255,255,0.7);}
  .action-btn{
    width:100%;
    padding:14px;
    font-size:1.1rem;
    font-weight:700;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:#fff;
    cursor:pointer;
    margin-top:8px;
  }
  .action-btn:active{background:var(--green-dark);}

  input.code-input{
    width:100%;
    padding:12px;
    font-size:1.1rem;
    border:2px solid var(--green);
    border-radius:10px;
    text-align:center;
    margin:10px 0;
    color:var(--text);
  }
  .error-text{color:var(--danger);font-size:.9rem;min-height:1.2em;}
</style>
</head>
<body>
<div id="app">

  <!-- LANGUAGE SELECT -->
  <div id="screen-lang" class="screen">
    <div class="lang-title">Select your language / Pasirinkite kalbą / Sprache wählen</div>
    <button class="lang-btn" data-lang="en"><span class="flag">🇬🇧</span> English</button>
    <button class="lang-btn" data-lang="lt"><span class="flag">🇱🇹</span> Lietuvių</button>
    <button class="lang-btn" data-lang="de"><span class="flag">🇩🇪</span> Deutsch</button>
  </div>

  <!-- MAIN GAME -->
  <div id="screen-game" class="screen hidden">
    <div class="instruction" id="instructionText"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;">
      <div class="timer" id="timerDisplay">05:00</div>
      <div id="progressWrap" style="flex:1;text-align:right;">
        <div id="stageLabel" style="font-size:.85rem;font-weight:700;color:#fff;margin-bottom:4px;"></div>
        <div style="display:flex;gap:5px;justify-content:flex-end;" id="stageDots"></div>
      </div>
    </div>

    <div class="camera-wrap">
      <video id="camera" playsinline autoplay muted></video>
      <canvas id="snap"></canvas>
      <div class="status-pill" id="statusPill">Starting camera...</div>
    </div>

    <button class="scan-btn" id="scanBtn" disabled>
      📷 <span id="scanBtnLabel">Scan Object</span>
    </button>

    <button class="manual-btn" id="manualBtn"></button>
  </div>

  <!-- STAGE WIN OVERLAY -->
  <div id="overlay-stage-win" class="overlay hidden">
    <div class="overlay-card">
      <div style="font-size:3rem;margin-bottom:8px;">✅</div>
      <h2 id="stageWinTitle"></h2>
      <p id="stageWinObject" style="font-size:1.1rem;margin:8px 0 16px;color:#555;"></p>
      <button class="action-btn" id="nextStageBtn"></button>
    </div>
  </div>

  <!-- FINAL WIN OVERLAY -->
  <div id="overlay-win" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="winTitle"></h2>
      <p id="winSubtitle" style="margin-bottom:10px;"></p>
      <div class="coords" id="winCoords"></div>
      <button class="action-btn" id="copyBtn"></button>
    </div>
  </div>

  <!-- LOSS OVERLAY -->
  <div id="overlay-loss" class="overlay hidden">
    <div class="overlay-card loss">
      <h2 id="lossTitle"></h2>
      <button class="action-btn" id="retryBtn"></button>
    </div>
  </div>

  <!-- MANUAL CODE OVERLAY -->
  <div id="overlay-manual" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="manualTitle"></h2>
      <p id="manualSubtitle"></p>
      <input type="text" class="code-input" id="manualInput" autocomplete="off" autocapitalize="characters">
      <div class="error-text" id="manualError"></div>
      <button class="action-btn" id="manualSubmit"></button>
      <button class="action-btn" id="manualCancel" style="background:var(--green-dark);"></button>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   GAME CONFIGURATION
   ===================================================================== */

const STAGES = [
  { object: "bench",    en: "bench",    lt: "suoliuką",   de: "Bank"     },
  { object: "bicycle",  en: "bicycle",  lt: "dviratį",    de: "Fahrrad"  },
  { object: "car",      en: "car",      lt: "automobilį", de: "Auto"     },
  { object: "backpack", en: "backpack", lt: "kuprinę",    de: "Rucksack" },
  { object: "bottle",   en: "bottle",   lt: "butelį",     de: "Flasche"  }
];

const FINAL_COORDINATES = "N 55° 43.123 E 021° 07.456";
const TIMER_DURATION    = 300;   // seconds
const MANUAL_CODE       = "FOREST42";

// Vision API — how small to resize the captured frame (keeps API calls fast)
const CAPTURE_WIDTH  = 640;
const CAPTURE_HEIGHT = 480;

/* =====================================================================
   TRANSLATIONS
   ===================================================================== */
const TRANSLATIONS = {
  en: {
    instructionPrefix:"Find this object:",instructionSuffix:"point your camera at it and tap Scan!",
    statusReady:"Camera ready — tap Scan",statusSending:"Analyzing image…",statusError:"Camera error. Try manual code.",
    scanBtn:"Scan Object",manualBtn:"Manual Code",stageTitle:"Object",stageOf:"of",
    stageWinTitle:"Found it!",stageWinNext:"Next Object →",
    finalWinTitle:"🎉 All Objects Found!",finalWinSubtitle:"Here are your final logbook coordinates:",
    copyBtn:"Copy Coordinates",copiedBtn:"Copied! ✓",
    lossTitle:"Time's Up!",retryBtn:"Retry",
    manualTitle:"Manual Code Entry",manualSubtitle:"Enter the secret code found on the object:",
    manualSubmit:"Submit",manualCancel:"Cancel",manualError:"Incorrect code. Try again."
  },
  lt: {
    instructionPrefix:"Rask šį objektą:",instructionSuffix:"nukreipk kamerą ir spustelėk Skenuoti!",
    statusReady:"Kamera paruošta — spustelėk Skenuoti",statusSending:"Analizuojama…",statusError:"Kameros klaida. Naudokite kodą.",
    scanBtn:"Skenuoti",manualBtn:"Įvesti kodą rankiniu būdu",stageTitle:"Objektas",stageOf:"iš",
    stageWinTitle:"Radai!",stageWinNext:"Kitas objektas →",
    finalWinTitle:"🎉 Visi objektai rasti!",finalWinSubtitle:"Štai jūsų finalinės koordinatės:",
    copyBtn:"Kopijuoti koordinates",copiedBtn:"Nukopijuota! ✓",
    lossTitle:"Laikas baigėsi!",retryBtn:"Bandyti iš naujo",
    manualTitle:"Kodo įvedimas",manualSubtitle:"Įveskite slaptą kodą, rastą ant objekto:",
    manualSubmit:"Patvirtinti",manualCancel:"Atšaukti",manualError:"Neteisingas kodas. Bandykite vėl."
  },
  de: {
    instructionPrefix:"Finde dieses Objekt:",instructionSuffix:"richte die Kamera darauf und tippe Scan!",
    statusReady:"Kamera bereit — tippe Scan",statusSending:"Analysiere Bild…",statusError:"Kamerafehler. Code manuell eingeben.",
    scanBtn:"Scannen",manualBtn:"Code manuell eingeben",stageTitle:"Objekt",stageOf:"von",
    stageWinTitle:"Gefunden!",stageWinNext:"Nächstes Objekt →",
    finalWinTitle:"🎉 Alle Objekte gefunden!",finalWinSubtitle:"Hier sind deine finalen Koordinaten:",
    copyBtn:"Koordinaten kopieren",copiedBtn:"Kopiert! ✓",
    lossTitle:"Zeit abgelaufen!",retryBtn:"Erneut versuchen",
    manualTitle:"Code-Eingabe",manualSubtitle:"Gib den geheimen Code ein, der am Objekt zu finden ist:",
    manualSubmit:"Bestätigen",manualCancel:"Abbrechen",manualError:"Falscher Code. Versuche es erneut."
  }
};

/* =====================================================================
   STATE
   ===================================================================== */
let currentLang    = "en";
let videoStream    = null;
let timerInterval  = null;
let timeRemaining  = TIMER_DURATION;
let gameEnded      = false;
let currentStage   = 0;
let isSending      = false;

/* =====================================================================
   ELEMENTS
   ===================================================================== */
const screenLang       = document.getElementById("screen-lang");
const screenGame       = document.getElementById("screen-game");
const instructionText  = document.getElementById("instructionText");
const timerDisplay     = document.getElementById("timerDisplay");
const statusPill       = document.getElementById("statusPill");
const stageLabel       = document.getElementById("stageLabel");
const stageDots        = document.getElementById("stageDots");
const video            = document.getElementById("camera");
const snapCanvas       = document.getElementById("snap");
const scanBtn          = document.getElementById("scanBtn");
const scanBtnLabel     = document.getElementById("scanBtnLabel");
const manualBtn        = document.getElementById("manualBtn");

const overlayStageWin  = document.getElementById("overlay-stage-win");
const stageWinTitle    = document.getElementById("stageWinTitle");
const stageWinObject   = document.getElementById("stageWinObject");
const nextStageBtn     = document.getElementById("nextStageBtn");

const overlayWin       = document.getElementById("overlay-win");
const winTitle         = document.getElementById("winTitle");
const winSubtitle      = document.getElementById("winSubtitle");
const winCoords        = document.getElementById("winCoords");
const copyBtn          = document.getElementById("copyBtn");

const overlayLoss      = document.getElementById("overlay-loss");
const lossTitle        = document.getElementById("lossTitle");
const retryBtn         = document.getElementById("retryBtn");

const overlayManual    = document.getElementById("overlay-manual");
const manualTitle      = document.getElementById("manualTitle");
const manualSubtitle   = document.getElementById("manualSubtitle");
const manualInput      = document.getElementById("manualInput");
const manualError      = document.getElementById("manualError");
const manualSubmit     = document.getElementById("manualSubmit");
const manualCancel     = document.getElementById("manualCancel");

/* =====================================================================
   LANGUAGE SELECT
   ===================================================================== */
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    screenLang.classList.add("hidden");
    screenGame.classList.remove("hidden");
    startGame();
  });
});

function tr() { return TRANSLATIONS[currentLang]; }

/* =====================================================================
   UI HELPERS
   ===================================================================== */
function applyTranslations() {
  const T = tr();
  const stage = STAGES[currentStage];
  const objName = stage[currentLang];

  instructionText.innerHTML = `<b>${T.instructionPrefix}</b> ${objName}, ${T.instructionSuffix}`;
  manualBtn.textContent     = T.manualBtn;
  scanBtnLabel.textContent  = T.scanBtn;

  stageLabel.textContent    = `${T.stageTitle} ${currentStage + 1} ${T.stageOf} ${STAGES.length}`;

  stageWinTitle.textContent  = T.stageWinTitle;
  stageWinObject.textContent = objName;
  nextStageBtn.textContent   = T.stageWinNext;

  winTitle.textContent    = T.finalWinTitle;
  winSubtitle.textContent = T.finalWinSubtitle;
  winCoords.textContent   = FINAL_COORDINATES;
  copyBtn.textContent     = T.copyBtn;

  lossTitle.textContent   = T.lossTitle;
  retryBtn.textContent    = T.retryBtn;

  manualTitle.textContent    = T.manualTitle;
  manualSubtitle.textContent = T.manualSubtitle;
  manualSubmit.textContent   = T.manualSubmit;
  manualCancel.textContent   = T.manualCancel;
  manualError.textContent    = "";
}

function renderDots() {
  stageDots.innerHTML = "";
  STAGES.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "stage-dot" + (i < currentStage ? " done" : i === currentStage ? " active" : "");
    stageDots.appendChild(dot);
  });
}

function setStatus(key, extraClass) {
  const text = tr()[key] || key;
  statusPill.textContent = text;
  statusPill.className = "status-pill" + (extraClass ? " " + extraClass : "");
}

/* =====================================================================
   GAME START / RESET
   ===================================================================== */
async function startGame() {
  gameEnded     = false;
  currentStage  = 0;
  timeRemaining = TIMER_DURATION;
  isSending     = false;
  timerDisplay.classList.remove("warning");
  overlayWin.classList.add("hidden");
  overlayLoss.classList.add("hidden");
  overlayStageWin.classList.add("hidden");
  scanBtn.disabled = true;

  applyTranslations();
  renderDots();
  updateTimerDisplay();
  startTimer();
  await startCamera();
}

function advanceStage() {
  currentStage++;
  overlayStageWin.classList.add("hidden");
  applyTranslations();
  renderDots();
  setStatus("statusReady", "scanning");
  scanBtn.disabled = false;
}

nextStageBtn.addEventListener("click", advanceStage);

/* =====================================================================
   TIMER
   ===================================================================== */
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeRemaining--;
    updateTimerDisplay();
    if (timeRemaining <= 30) timerDisplay.classList.add("warning");
    if (timeRemaining <= 0) endGame("loss");
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(Math.max(timeRemaining, 0) / 60);
  const s = Math.max(timeRemaining, 0) % 60;
  timerDisplay.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* =====================================================================
   CAMERA
   ===================================================================== */
async function startCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = videoStream;
    await video.play();
    setStatus("statusReady", "scanning");
    scanBtn.disabled = false;
  } catch (err) {
    setStatus("statusError");
    console.error("Camera error:", err);
  }
}

function stopCamera() {
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
}

/* =====================================================================
   CAPTURE FRAME → BASE64
   ===================================================================== */
function captureFrame() {
  const ctx = snapCanvas.getContext("2d");
  snapCanvas.width  = CAPTURE_WIDTH;
  snapCanvas.height = CAPTURE_HEIGHT;
  ctx.drawImage(video, 0, 0, CAPTURE_WIDTH, CAPTURE_HEIGHT);
  // JPEG at 0.75 quality — good enough for object ID, much smaller payload
  return snapCanvas.toDataURL("image/jpeg", 0.75).split(",")[1];
}

/* =====================================================================
   VISION API — ask Claude if the target object is in the frame
   ===================================================================== */
async function checkImageWithClaude(base64Image) {
  const target    = STAGES[currentStage].object;
  const objLabel  = STAGES[currentStage][currentLang];

  const prompt = `You are a geocache field-puzzle assistant. Look at this photo and answer ONLY with the single word YES or NO.
Is there a ${target} clearly visible in this image?
Rules:
- Answer YES only if the object is unambiguous and prominently in the frame.
- Answer NO if it is absent, partially cut off, or unclear.
- Output exactly one word: YES or NO`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 10,
      messages: [{
        role: "user",
        content: [
          {
            type: "image",
            source: { type: "base64", media_type: "image/jpeg", data: base64Image }
          },
          { type: "text", text: prompt }
        ]
      }]
    })
  });

  if (!response.ok) throw new Error("API error " + response.status);
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || "").join("").trim().toUpperCase();
  return text.startsWith("YES");
}

/* =====================================================================
   SCAN BUTTON
   ===================================================================== */
scanBtn.addEventListener("click", async () => {
  if (isSending || gameEnded) return;
  isSending = true;
  scanBtn.disabled = true;
  setStatus("statusSending", "sending");

  try {
    const b64 = captureFrame();
    const found = await checkImageWithClaude(b64);

    if (found) {
      if (currentStage === STAGES.length - 1) {
        endGame("win");
      } else {
        overlayStageWin.classList.remove("hidden");
      }
    } else {
      setStatus("statusReady", "scanning");
      scanBtn.disabled = false;
    }
  } catch (err) {
    console.error("Vision API error:", err);
    setStatus("statusReady", "scanning");
    scanBtn.disabled = false;
  } finally {
    isSending = false;
  }
});

/* =====================================================================
   END GAME
   ===================================================================== */
function endGame(result) {
  if (gameEnded) return;
  gameEnded = true;
  clearInterval(timerInterval);
  stopCamera();
  overlayStageWin.classList.add("hidden");
  if (result === "win") {
    overlayWin.classList.remove("hidden");
  } else {
    overlayLoss.classList.remove("hidden");
  }
}

/* =====================================================================
   COPY COORDS
   ===================================================================== */
copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(FINAL_COORDINATES);
    copyBtn.textContent = tr().copiedBtn;
    setTimeout(() => { copyBtn.textContent = tr().copyBtn; }, 2500);
  } catch {
    const range = document.createRange();
    range.selectNode(winCoords);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
});

/* =====================================================================
   RETRY
   ===================================================================== */
retryBtn.addEventListener("click", () => {
  overlayLoss.classList.add("hidden");
  startGame();
});

/* =====================================================================
   MANUAL CODE
   ===================================================================== */
manualBtn.addEventListener("click", () => {
  manualInput.value = "";
  manualError.textContent = "";
  overlayManual.classList.remove("hidden");
});
manualCancel.addEventListener("click", () => { overlayManual.classList.add("hidden"); });
manualSubmit.addEventListener("click", () => {
  if (manualInput.value.trim().toUpperCase() === MANUAL_CODE.toUpperCase()) {
    overlayManual.classList.add("hidden");
    endGame("win");
  } else {
    manualError.textContent = tr().manualError;
  }
});
</script>
</body>
</html>
