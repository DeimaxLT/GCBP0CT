<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ High Voltage Cache</title>
<style>
  :root{--yellow:#FFD600;--yellow-dark:#c9a800;--black:#0a0a0a;--dark:#111;--dark2:#1a1a1a;--danger:#ff3333;--text:#fff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--black);color:var(--text);}
  #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;}
  .screen{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:fadeIn .35s ease;}
  .hidden{display:none !important;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .lang-header{text-align:center;margin-top:32px;}
  .bolt{font-size:4rem;display:block;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{text-shadow:0 0 10px #FFD600,0 0 30px #FFD600;}50%{text-shadow:0 0 4px #FFD600;}}
  .lang-title{font-size:1.5rem;font-weight:800;color:var(--yellow);margin-top:8px;letter-spacing:1px;}
  .lang-subtitle{font-size:.9rem;color:#888;margin-top:4px;}
  .lang-btn{width:100%;padding:16px;font-size:1.1rem;font-weight:700;border:2px solid var(--yellow);border-radius:12px;background:transparent;color:var(--yellow);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s;}
  .lang-btn:active{background:rgba(255,214,0,.1);}
  .flag{font-size:1.3rem;}
  .instruction{font-size:1rem;line-height:1.5;text-align:center;background:var(--dark2);border:2px solid var(--yellow);border-radius:12px;padding:12px 14px;width:100%;color:#eee;}
  .instruction b{color:var(--yellow);}
  .timer-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;}
  .timer{font-size:2.4rem;font-weight:800;color:var(--yellow);background:var(--dark2);border:2px solid var(--yellow);border-radius:12px;padding:6px 22px;letter-spacing:3px;font-variant-numeric:tabular-nums;}
  .timer.warning{color:var(--danger);border-color:var(--danger);animation:flicker .4s infinite;}
  @keyframes flicker{0%,100%{opacity:1;}50%{opacity:.6;}}
  .stage-info{flex:1;text-align:right;}
  .stage-label{font-size:.8rem;font-weight:700;color:#888;margin-bottom:4px;}
  .stage-dots{display:flex;gap:5px;justify-content:flex-end;}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--dark2);border:2px solid #444;transition:all .3s;}
  .dot.done{background:var(--yellow);border-color:var(--yellow);}
  .dot.active{background:rgba(255,214,0,.4);border-color:var(--yellow);}
  .camera-wrap{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:16px;overflow:hidden;border:2px solid var(--yellow);}
  video{width:100%;height:100%;object-fit:cover;}
  .status-pill{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 16px;border-radius:20px;font-size:.85rem;font-weight:600;white-space:nowrap;border:1px solid #333;}
  .status-pill.ready{border-color:var(--yellow);color:var(--yellow);}
  .status-pill.sending{border-color:#4fc;color:#4fc;}
  .status-pill.error{border-color:var(--danger);color:var(--danger);}
  .status-pill.success{border-color:#4f4;color:#4f4;}
  #debugList{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none;}
  .dtag{background:rgba(0,0,0,.8);color:#ccc;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;width:fit-content;}
  .dtag.hit{background:rgba(255,214,0,.85);color:#000;}
  .debug-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:1px solid #444;color:#aaa;font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px;cursor:pointer;}
  .scan-btn{width:100%;padding:16px;font-size:1.15rem;font-weight:800;border:none;border-radius:12px;background:var(--yellow);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px;}
  .scan-btn:disabled{opacity:.4;cursor:not-allowed;}
  .scan-btn:active:not(:disabled){background:var(--yellow-dark);}
  .manual-btn{background:none;border:none;color:#666;text-decoration:underline;font-size:.85rem;cursor:pointer;}
  #modelBanner{width:100%;background:var(--dark2);border:1px solid #333;border-radius:10px;padding:10px 14px;font-size:.9rem;text-align:center;color:#aaa;}
  #modelBar{height:5px;background:#222;border-radius:3px;margin-top:6px;}
  #modelFill{height:100%;width:0%;background:var(--yellow);border-radius:3px;transition:width .3s;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .card{background:var(--dark2);border:2px solid var(--yellow);border-radius:16px;padding:28px 22px;text-align:center;max-width:420px;width:100%;}
  .card h2{color:var(--yellow);font-size:1.5rem;margin-bottom:8px;}
  .card.loss{border-color:var(--danger);}
  .card.loss h2{color:var(--danger);}
  .coords{font-size:1.2rem;font-weight:800;background:#000;border:2px dashed var(--yellow);border-radius:10px;padding:14px;margin:12px 0;word-break:break-word;color:var(--yellow);letter-spacing:1px;}
  .action-btn{width:100%;padding:14px;font-size:1rem;font-weight:700;border:none;border-radius:10px;background:var(--yellow);color:#000;cursor:pointer;margin-top:10px;}
  .action-btn:active{background:var(--yellow-dark);}
  .action-btn.dark{background:#222;color:#aaa;border:1px solid #444;}
  input.code-input{width:100%;padding:12px;font-size:1.1rem;border:2px solid var(--yellow);border-radius:10px;text-align:center;margin:10px 0;color:#fff;background:#000;}
  .error-text{color:var(--danger);font-size:.85rem;min-height:1.2em;}
</style>
</head>
<body>
<div id="app">
  <div id="screen-lang" class="screen">
    <div class="lang-header">
      <span class="bolt">⚡</span>
      <div class="lang-title">HIGH VOLTAGE CACHE</div>
      <div class="lang-subtitle">Select language / Pasirinkite kalbą</div>
    </div>
    <button class="lang-btn" data-lang="en"><span class="flag">🇬🇧</span> English</button>
    <button class="lang-btn" data-lang="lt"><span class="flag">🇱🇹</span> Lietuvių</button>
  </div>
  <div id="screen-game" class="screen hidden">
    <div style="font-size:1.3rem;font-weight:800;color:var(--yellow);letter-spacing:2px;">⚡ HIGH VOLTAGE CACHE</div>
    <div id="modelBanner">
      <span id="modelTxt">Initializing…</span>
      <div id="modelBar"><div id="modelFill"></div></div>
    </div>
    <div class="instruction" id="instructionText"></div>
    <div class="timer-row">
      <div class="timer" id="timerDisplay">05:00</div>
      <div class="stage-info">
        <div class="stage-label" id="stageLabel"></div>
        <div class="stage-dots" id="stageDots"></div>
      </div>
    </div>
    <div class="camera-wrap">
      <video id="camera" playsinline autoplay muted></video>
      <div id="debugList"></div>
      <button class="debug-btn" id="debugToggle">🔍 OFF</button>
      <div class="status-pill" id="statusPill">⚡ Starting…</div>
    </div>
    <button class="scan-btn" id="scanBtn" disabled>⚡ <span id="scanBtnLabel">Scan</span></button>
    <button class="manual-btn" id="manualBtn"></button>
  </div>
  <div id="overlay-stage-win" class="overlay hidden">
    <div class="card">
      <div style="font-size:3rem;">⚡✅</div>
      <h2 id="stageWinTitle"></h2>
      <p id="stageWinDesc" style="color:#aaa;margin:8px 0 16px;font-size:1rem;"></p>
      <button class="action-btn" id="nextStageBtn"></button>
    </div>
  </div>
  <div id="overlay-win" class="overlay hidden">
    <div class="card">
      <div style="font-size:2.5rem;margin-bottom:6px;">⚡🏆⚡</div>
      <h2 id="winTitle"></h2>
      <p id="winSubtitle" style="color:#aaa;margin-bottom:6px;"></p>
      <div class="coords" id="winCoords"></div>
      <button class="action-btn" id="copyBtn"></button>
    </div>
  </div>
  <div id="overlay-loss" class="overlay hidden">
    <div class="card loss">
      <div style="font-size:2.5rem;margin-bottom:6px;">💀</div>
      <h2 id="lossTitle"></h2>
      <p style="color:#888;margin-bottom:8px;" id="lossSubtitle"></p>
      <button class="action-btn" id="retryBtn"></button>
    </div>
  </div>
  <div id="overlay-manual" class="overlay hidden">
    <div class="card">
      <h2 id="manualTitle"></h2>
      <p id="manualSubtitle" style="color:#aaa;margin-bottom:6px;font-size:.9rem;"></p>
      <input type="text" class="code-input" id="manualInput" autocomplete="off" autocapitalize="characters">
      <div class="error-text" id="manualError"></div>
      <button class="action-btn" id="manualSubmit"></button>
      <button class="action-btn dark" id="manualCancel"></button>
    </div>
  </div>
</div>
<script>
/* CONFIG */
// FIX: calling detect.roboflow.com directly from the browser was blocked by
// CORS (Roboflow's workflow endpoint doesn't return Access-Control-Allow-Origin
// for browser callers). We now call our own serverless proxy instead, which
// forwards the request to Roboflow server-side where CORS doesn't apply.
// Replace this with your actual deployed proxy URL, e.g.
// "https://your-project.vercel.app/api/infer"
const PROXY_URL             = "https://gcbp-0-ct.vercel.app/api/infer";
const FINAL_COORDS         = "N 55\u00b0 42.566 E 21\u00b0 08.396";
const TIMER_DURATION       = 300;
const MANUAL_CODE          = "VOLTAGE42";
const CONFIDENCE_THRESHOLD = 0.40;
const CONFIRM_HITS         = 3;
const SCAN_INTERVAL_MS     = 1500;
const ERROR_BACKOFF_MS     = 5000;
// FIX: requests could hang forever with no feedback (looked "stuck at connecting").
// Abort and treat as a failure if the API hasn't responded within this window.
const REQUEST_TIMEOUT_MS      = 12000;
// FIX: a single flaky/dropped request was instantly flashing the alarming
// "retrying" status, causing fast flicker between normal and error states.
// Only treat it as a real connection problem after this many *consecutive* failures.
const ERROR_DISPLAY_THRESHOLD = 2;
// FIX: isolated blips (below the threshold above) retry quickly and quietly,
// without touching the visible status at all.
const QUICK_RETRY_MS          = 1200;
const STAGES = [
  { object:"bench",     en:"bench",      lt:"suoliuk\u0105"   },
  { object:"rock",      en:"rock",       lt:"akmen\u012f"     },
  { object:"tree",      en:"tree",       lt:"med\u012f"       },
  { object:"car",       en:"car",        lt:"automobil\u012f" },
  { object:"lamp post", en:"lamp post",  lt:"\u017eibint\u0105"},
  { object:"sign",      en:"sign",       lt:"\u017enkl\u0105" },
];
const T = {
  en:{
    instructionPrefix:"Find and point at:",
    instructionSuffix:"Hold steady — it detects automatically!",
    statusConnecting:"⚡ Connecting to detector…",
    statusReady:"⚡ Ready — point at object",
    statusScanning:"🔍 Scanning…",
    statusWrong:"Not detected — keep trying",
    statusRetrying:"⚠️ Connection issue — retrying in 5s…",
    statusSuccess:"✅ Detected!",
    scanBtn:"⚡ Scan",
    manualBtn:"Enter manual code",
    stageTitle:"Stage", stageOf:"of",
    stageWinTitle:"Charged! ⚡",
    stageWinFound:"You found the",
    stageWinNext:"Next Stage \u2192",
    winTitle:"FULLY CHARGED! ⚡",
    winSubtitle:"You completed the High Voltage Cache! Final coordinates:",
    copyBtn:"Copy Coordinates",
    copiedBtn:"Copied! \u2713",
    lossTitle:"Power Cut! 💀",
    lossSubtitle:"The voltage dropped to zero. Try again?",
    retryBtn:"Reconnect ⚡",
    manualTitle:"Manual Override",
    manualSubtitle:"Enter the secret code from the object:",
    manualSubmit:"Confirm",
    manualCancel:"Cancel",
    manualError:"Wrong code. Try again.",
    modelLoading:"Connecting to detector…",
    modelReady:"⚡ Detector ready — timer started!",
    // FIX: shown after repeated pre-ready failures so "stuck" actually communicates what's happening
    modelStruggling:"Still trying to connect — check your signal…",
  },
  lt:{
    instructionPrefix:"Rask ir nukreipk kamer\u0105 \u012f:",
    instructionSuffix:"Laikyk ramiai — aptikimas automatinis!",
    statusConnecting:"⚡ Jungiamasi…",
    statusReady:"⚡ Paruošta — nukreipk \u012f objekt\u0105",
    statusScanning:"🔍 Skenuojama…",
    statusWrong:"Nerasta — bandyk toliau",
    statusRetrying:"⚠️ Ryšio problema — kartojama po 5s…",
    statusSuccess:"✅ Aptikta!",
    scanBtn:"⚡ Skenuoti",
    manualBtn:"Įvesti kod\u0105 rankiniu b\u016bdu",
    stageTitle:"Etapas", stageOf:"i\u0161",
    stageWinTitle:"Įkrauta! ⚡",
    stageWinFound:"Radai",
    stageWinNext:"Kitas etapas \u2192",
    winTitle:"PILNAI ĮKRAUTA! ⚡",
    winSubtitle:"Užbaigei High Voltage Cache! Galutin\u0117s koordinat\u0117s:",
    copyBtn:"Kopijuoti koordinates",
    copiedBtn:"Nukopijuota! \u2713",
    lossTitle:"Srov\u0117 nutr\u016bko! 💀",
    lossSubtitle:"Laikas baig\u0117si. Bandyti i\u0161 naujo?",
    retryBtn:"Jungtis i\u0161 naujo ⚡",
    manualTitle:"Rankinis įvedimas",
    manualSubtitle:"Įvesk slapt\u0105 kod\u0105 nuo objekto:",
    manualSubmit:"Patvirtinti",
    manualCancel:"At\u0161aukti",
    manualError:"Neteisingas kodas. Bandyk dar.",
    modelLoading:"Jungiamasi prie aptiktuvo…",
    modelReady:"⚡ Aptiktuvas paruoštas — laikmatis paleistas!",
    // FIX: shown after repeated pre-ready failures so "stuck" actually communicates what's happening
    modelStruggling:"Nepavyksta prisijungti — patikrink interneto ryšį…",
  }
};

/* STATE */
let lang          = "en";
let videoStream   = null;
let timerInterval = null;
let scanTimeout   = null;
let timeLeft      = TIMER_DURATION;
let gameEnded     = false;
let stage         = 0;
let hitCount      = 0;
let debugMode     = false;
let lastPreds     = [];
let timerStarted  = false;
let modelReady    = false;
let bannerIv      = null;
let isErrorState  = false;  // true only once we're in a *sustained* failure run (>= threshold)
let consecutiveErrors = 0;  // FIX: counts back-to-back failures so single blips don't trigger the error UI
let lastCapturedDataUrl = null;  // DEBUG: most recent captured frame, for the long-press download feature

/* ELEMENTS */
const $= id=>document.getElementById(id);
const elScreenLang   =$("screen-lang");
const elScreenGame   =$("screen-game");
const elInstruction  =$("instructionText");
const elTimer        =$("timerDisplay");
const elStatus       =$("statusPill");
const elStageLabel   =$("stageLabel");
const elStageDots    =$("stageDots");
const elVideo        =$("camera");
const elScanBtn      =$("scanBtn");
const elScanBtnLabel =$("scanBtnLabel");
const elManualBtn    =$("manualBtn");
const elDebugToggle  =$("debugToggle");
const elDebugList    =$("debugList");
const elModelBanner  =$("modelBanner");
const elModelTxt     =$("modelTxt");
const elModelFill    =$("modelFill");
const elStageWin     =$("overlay-stage-win");
const elStageWinTitle=$("stageWinTitle");
const elStageWinDesc =$("stageWinDesc");
const elNextStageBtn =$("nextStageBtn");
const elWin          =$("overlay-win");
const elWinTitle     =$("winTitle");
const elWinSubtitle  =$("winSubtitle");
const elWinCoords    =$("winCoords");
const elCopyBtn      =$("copyBtn");
const elLoss         =$("overlay-loss");
const elLossTitle    =$("lossTitle");
const elLossSubtitle =$("lossSubtitle");
const elRetryBtn     =$("retryBtn");
const elManualOverlay=$("overlay-manual");
const elManualTitle  =$("manualTitle");
const elManualSub    =$("manualSubtitle");
const elManualInput  =$("manualInput");
const elManualError  =$("manualError");
const elManualSubmit =$("manualSubmit");
const elManualCancel =$("manualCancel");
const tr = () => T[lang];

/* LANG SELECT */
document.querySelectorAll(".lang-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    lang = btn.dataset.lang;
    elScreenLang.classList.add("hidden");
    elScreenGame.classList.remove("hidden");
    startGame();
  });
});

/* UI */
function applyUI(){
  const L=tr(), s=STAGES[stage];
  if(!s) return;  // guard against out-of-bounds stage
  const obj=s[lang]||s.en;
  elInstruction.innerHTML=`<b>${L.instructionPrefix}</b> <span style="color:var(--yellow);font-weight:800;">${obj}</span><br><span style="font-size:.85rem;color:#aaa;">${L.instructionSuffix}</span>`;
  elManualBtn.textContent     = L.manualBtn;
  elScanBtnLabel.textContent  = L.scanBtn;
  elStageLabel.textContent    = `${L.stageTitle} ${stage+1} ${L.stageOf} ${STAGES.length}`;
  elStageWinTitle.textContent = L.stageWinTitle;
  elStageWinDesc.textContent  = `${L.stageWinFound} ${obj}`;  // add context label so it reads as a sentence
  elNextStageBtn.textContent  = L.stageWinNext;
  elWinTitle.textContent      = L.winTitle;
  elWinSubtitle.textContent   = L.winSubtitle;
  elWinCoords.textContent     = FINAL_COORDS;
  elCopyBtn.textContent       = L.copyBtn;
  elLossTitle.textContent     = L.lossTitle;
  elLossSubtitle.textContent  = L.lossSubtitle;
  elRetryBtn.textContent      = L.retryBtn;
  elManualTitle.textContent   = L.manualTitle;
  elManualSub.textContent     = L.manualSubtitle;
  elManualSubmit.textContent  = L.manualSubmit;
  elManualCancel.textContent  = L.manualCancel;
  elManualError.textContent   = "";
  renderDots();
}

function renderDots(){
  elStageDots.innerHTML="";
  STAGES.forEach((_,i)=>{
    const d=document.createElement("div");
    d.className="dot"+(i<stage?" done":i===stage?" active":"");
    elStageDots.appendChild(d);
  });
}

function setStatus(key,cls){
  elStatus.textContent = tr()[key]||key;
  elStatus.className   = "status-pill"+(cls?" "+cls:"");
  elStatus.dataset.key = key;  // FIX: track current status key so repeated identical calls can be skipped
}

/* GAME */
async function startGame(){
  gameEnded=false; stage=0; timeLeft=TIMER_DURATION;
  hitCount=0; timerStarted=false; modelReady=false; isErrorState=false;
  consecutiveErrors=0;  // FIX: reset failure streak on (re)start
  clearTimeout(scanTimeout); clearInterval(timerInterval); clearInterval(bannerIv);
  elTimer.classList.remove("warning");
  ["overlay-win","overlay-loss","overlay-stage-win"].forEach(id=>$(id).classList.add("hidden"));
  elScanBtn.disabled=true;
  updateTimer(); applyUI();
  setStatus("statusConnecting","sending");
  await startCamera();
  showModelBanner();
  scheduleNextScan(0);
}

function advanceStage(){
  // guard against advancing past the last stage (e.g. double-tap)
  if(stage >= STAGES.length - 1) return;
  stage++; hitCount=0; isErrorState=false;
  consecutiveErrors=0;  // FIX: reset failure streak on stage advance
  elStageWin.classList.add("hidden");
  applyUI();
  setStatus("statusReady","ready");
}
elNextStageBtn.addEventListener("click", advanceStage);

/* TIMER — only starts after first successful API response */
function startTimer(){
  if(timerStarted) return;
  timerStarted=true;
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=30) elTimer.classList.add("warning");
    if(timeLeft<=0)  endGame("loss");
  },1000);
}

function updateTimer(){
  const m=Math.floor(Math.max(timeLeft,0)/60);
  const s=Math.max(timeLeft,0)%60;
  elTimer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* CAMERA */
async function startCamera(){
  try{
    // FIX: the `zoom` constraint isn't reliably honored on Android Chrome —
    // it often still defaults to the ultra-wide lens. Instead, enumerate the
    // actual camera devices and pick the main rear lens by label, since
    // multi-lens phones (Samsung especially) label them predictably
    // (e.g. "Back Camera" vs "Back Ultra Wide Camera").
    let chosenDeviceId = null;
    try{
      // labels are only populated after at least one getUserMedia call has
      // been granted, so do a throwaway request first if needed
      let devices = await navigator.mediaDevices.enumerateDevices();
      if(devices.every(d=>!d.label)){
        const temp = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
        temp.getTracks().forEach(t=>t.stop());
        devices = await navigator.mediaDevices.enumerateDevices();
      }
      const cams = devices.filter(d=>d.kind==="videoinput");
      console.log("Available cameras:", cams.map(c=>c.label));
      // Only trust the primary label matcher if the labels actually contain
      // descriptive lens info (e.g. "wide", "ultra", "main", "tele") — generic
      // labels like "camera 2, facing back" all contain "back" with no other
      // signal, which made every back camera match equally and `.find()` just
      // returned whichever happened to be first in the array (wrong lens).
      const anyDescriptive = cams.some(c=>{
        const l=c.label.toLowerCase();
        return l.includes("ultra")||l.includes("wide")||l.includes("tele")||l.includes("macro")||l.includes("main");
      });
      let main = null;
      if(anyDescriptive){
        main = cams.find(c=>{
          const l=c.label.toLowerCase();
          const isBack = l.includes("back") || l.includes("rear") || l.includes("environment");
          const isAltLens = l.includes("ultra") || l.includes("wide") || l.includes("tele") || l.includes("macro");
          return isBack && !isAltLens;
        });
      }
      // FIX: some Android/Chrome builds give generic labels like "camera 0,
      // facing back" with no lens-type info at all. In that case, fall back
      // to picking the LOWEST-numbered back-facing camera, since index 0 is
      // conventionally the main lens on most Android devices (higher indices
      // are typically ultra-wide/telephoto add-ons).
      if(!main){
        const backCams = cams.filter(c=>c.label.toLowerCase().includes("back"));
        const withIndex = backCams.map(c=>{
          const m = c.label.match(/camera\s*(\d+)/i);
          return {cam:c, idx: m ? parseInt(m[1],10) : 99};
        }).sort((a,b)=>a.idx-b.idx);
        if(withIndex.length) main = withIndex[0].cam;
      }
      if(main) chosenDeviceId = main.deviceId;
    }catch(e){ console.error("Camera enumeration failed:", e); }

    const constraintsAttempts = [
      ...(chosenDeviceId ? [{video:{deviceId:{exact:chosenDeviceId}}, audio:false}] : []),
      {video:{facingMode:"environment", zoom:1}, audio:false},
      {video:{facingMode:"environment"}, audio:false}, // fallback: original behavior
    ];
    for(const constraints of constraintsAttempts){
      try{
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        break;
      }catch(_){ /* try next constraint set */ }
    }
    if(!videoStream) throw new Error("No camera constraints succeeded");
    elVideo.srcObject=videoStream;
    await elVideo.play();

    const track = videoStream.getVideoTracks()[0];
    console.log("Using camera:", track?.label);
    if(track && track.getCapabilities){
      const caps = track.getCapabilities();
      if(caps.zoom){
        const targetZoom = Math.max(caps.zoom.min, Math.min(1, caps.zoom.max));
        try{ await track.applyConstraints({advanced:[{zoom:targetZoom}]}); }catch(_){}
      }
    }
  }catch(e){ console.error("Camera:",e); }
}

function stopCamera(){
  clearTimeout(scanTimeout);
  if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null;}
}

// stop camera on page unload to release camera indicator on mobile browsers
window.addEventListener("pagehide", stopCamera);

/* FRAME CAPTURE */
function captureBase64(){
  const w=elVideo.videoWidth, h=elVideo.videoHeight;
  // bail out if video not ready — avoids sending a blank black frame to the API
  if(!w || !h) return null;
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  c.getContext("2d").drawImage(elVideo,0,0);
  const dataUrl = c.toDataURL("image/jpeg",0.8);
  lastCapturedDataUrl = dataUrl;  // DEBUG: keep the latest frame available for long-press download
  // DEBUG: log frame dimensions and a way to view the actual captured image,
  // so we can confirm the camera frame looks correct before it's sent out.
  if(debugMode){
    console.log("Captured frame:", w+"x"+h, "size(b64 chars):", dataUrl.length);
    console.log("Paste this in a new browser tab to view the captured frame:", dataUrl);
  }
  return dataUrl.split(",")[1];
}

/* MODEL BANNER — animates while waiting, only completes on first success */
function showModelBanner(){
  elModelBanner.classList.remove("hidden");
  elModelTxt.textContent=tr().modelLoading;
  elModelFill.style.width="0%";
  let p=0;
  clearInterval(bannerIv);
  bannerIv=setInterval(()=>{
    if(p<85){p+=4; elModelFill.style.width=p+"%";}
  },300);
}

function markModelReady(){
  if(modelReady) return;
  modelReady=true;
  clearInterval(bannerIv);
  elModelFill.style.width="100%";
  elModelTxt.textContent=tr().modelReady;
  elScanBtn.disabled=false;
  setTimeout(()=>elModelBanner.classList.add("hidden"),1500);
}

// FIX: while we're still waiting for the very first successful response,
// repeated failures now update the banner text instead of sitting frozen
// on "Connecting…" forever with no explanation.
function updateStruggleBanner(){
  if(modelReady) return;
  elModelTxt.textContent = tr().modelStruggling;
}

/* ROBOFLOW (via proxy) */
async function callRoboflow(b64){
  // FIX: abort the request if it hangs instead of waiting on it indefinitely —
  // this was the main cause of the UI appearing permanently "stuck".
  const controller = new AbortController();
  const timeoutId  = setTimeout(()=>controller.abort(), REQUEST_TIMEOUT_MS);
  try{
    // FIX: call our own proxy, not Roboflow directly — no api_key here,
    // the proxy attaches it server-side from an environment variable.
    const resp=await fetch(PROXY_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({image:b64}),
      signal: controller.signal
    });
    if(!resp.ok){
      // DEBUG: surface the real response body so we can see *why* it's failing
      // (bad key, wrong workflow path, etc.) instead of a generic status code.
      let bodyText = "";
      try{ bodyText = await resp.text(); }catch(_){}
      console.error("Proxy error response:", resp.status, bodyText);
      throw new Error("HTTP "+resp.status+": "+bodyText.slice(0,200));
    }
    return resp.json();
  } finally {
    clearTimeout(timeoutId);
  }
}

function extractPredictions(data){
  // FIX: this is the actual bug behind "nothing detected" despite Roboflow
  // correctly finding objects at high confidence. The real response shape is
  // { outputs: [ { predictions: { predictions: [...] } } ] } — `outputs` is
  // an ARRAY, so `data.outputs.predictions` is always undefined (arrays don't
  // have a .predictions property). The old code never indexed into outputs[0],
  // so it silently fell through to an empty array on every single request.
  if(Array.isArray(data?.outputs)){
    for(const item of data.outputs){
      const p = item?.predictions?.predictions || item?.predictions;
      if(Array.isArray(p)) return p;
    }
  }
  if(Array.isArray(data)){
    for(const item of data){
      const p=item?.predictions?.predictions||item?.predictions||item?.outputs?.predictions?.predictions||item?.outputs?.predictions;
      if(Array.isArray(p)) return p;
    }
  }
  return data?.predictions?.predictions||data?.predictions||[];
}

/* SCAN LOOP */
function scheduleNextScan(delay){ clearTimeout(scanTimeout); scanTimeout=setTimeout(runScan,delay); }

async function runScan(){
  if(gameEnded) return;
  if(!elStageWin.classList.contains("hidden")){ scheduleNextScan(500); return; }

  // FIX: previously this set "Skenuojama" at the start of every single cycle,
  // even when the result was going to be the same uneventful "nothing here"
  // as the cycle before — that produced a visible flip between "Skenuojama"
  // and "Paru\u0161ota" every 1.5s forever, which read as the status spamming.
  // Now we only show the transient "scanning" text while we don't yet have a
  // settled state to display (i.e. before the very first result comes in).
  const hasSettledState = modelReady && !isErrorState;
  if(!isErrorState && !hasSettledState) setStatus("statusScanning","sending");

  // skip API call if video frame not ready yet
  const b64 = captureBase64();
  if(!b64){ scheduleNextScan(SCAN_INTERVAL_MS); return; }

  try{
    const data  = await callRoboflow(b64);
    const preds = extractPredictions(data);
    lastPreds   = preds;

    // success — clear any failure streak
    isErrorState = false;
    consecutiveErrors = 0;  // FIX: reset streak so the next isolated blip doesn't immediately count as "2 in a row"

    markModelReady();
    startTimer();
    if(debugMode){
      renderDebug(preds);
      // DEBUG: also show the raw response shape on screen, so we can see
      // exactly what Roboflow returned even when extractPredictions finds
      // nothing — helps catch cases where the response shape differs from
      // what we expect (e.g. nested differently, or an error buried inside
      // an otherwise-200 response).
      renderRawDebug(data);
    }

    const target = STAGES[stage].object.toLowerCase();
    const hit    = preds.some(p=>p.class?.toLowerCase()===target && p.confidence>=CONFIDENCE_THRESHOLD);
    if(hit){
      hitCount++;
      setStatus("statusSuccess","success");
      if(hitCount>=CONFIRM_HITS){
        hitCount=0;
        if(stage===STAGES.length-1){ endGame("win"); return; }
        else { elStageWin.classList.remove("hidden"); }
      }
    } else {
      if(hitCount>0) hitCount=Math.max(0,hitCount-1);
      // FIX: only actually change the displayed status if it's different from
      // what's already showing — prevents re-setting "Paru\u0161ota" -> "Paru\u0161ota"
      // every cycle, which was the visible source of the flicker/spam.
      const nextKey = preds.length?"statusWrong":"statusReady";
      const nextCls = preds.length?"error":"ready";
      if(elStatus.dataset.key !== nextKey){
        setStatus(nextKey, nextCls);
      }
    }
    scheduleNextScan(SCAN_INTERVAL_MS);
  } catch(e){
    console.error("Roboflow:",e);
    consecutiveErrors++;
    // FIX: this is the core fix for the flicker bug. A single dropped/slow
    // request used to immediately flash the alarming "retrying" status, which
    // — on a flaky connection — produced rapid success/error/success/error
    // flicker. Now we only switch into the visible "retrying" state once
    // failures are sustained (consecutive), and isolated blips just retry
    // quickly in the background with no visible change at all.
    if(consecutiveErrors >= ERROR_DISPLAY_THRESHOLD){
      isErrorState = true;
      setStatus("statusRetrying","error");
      updateStruggleBanner();  // also clarifies the "stuck connecting" banner
      scheduleNextScan(ERROR_BACKOFF_MS);
    } else {
      scheduleNextScan(QUICK_RETRY_MS);
    }
  }
}

/* DEBUG */
function renderDebug(preds){
  elDebugList.innerHTML="";
  const target=STAGES[stage].object.toLowerCase();
  if(!preds.length){
    const t=document.createElement("div");
    t.className="dtag"; t.textContent="nothing detected";
    elDebugList.appendChild(t); return;
  }
  preds.forEach(p=>{
    const isHit=p.class?.toLowerCase()===target;
    const t=document.createElement("div");
    t.className="dtag"+(isHit?" hit":"");
    t.textContent=`${p.class} ${Math.round((p.confidence||0)*100)}%${isHit?" ✓":""}`;
    elDebugList.appendChild(t);
  });
}

// DEBUG: show the literal raw JSON response from the proxy/Roboflow directly
// on screen (tap to expand/collapse), so it can be read live on a phone with
// no PC or console access needed.
let elRawDebug = null;
let elRawDebugCopyBtn = null;
let lastRawDebugText = "";
function renderRawDebug(data){
  if(!elRawDebug){
    elRawDebug = document.createElement("div");
    elRawDebug.id = "rawDebugPanel";
    elRawDebug.style.cssText = "position:absolute;left:8px;right:8px;bottom:84px;max-height:140px;overflow:auto;background:rgba(0,0,0,.9);border:1px solid #555;border-radius:8px;padding:6px 8px;font-size:10px;line-height:1.3;color:#9f9;font-family:monospace;white-space:pre-wrap;word-break:break-all;z-index:30;";
    elRawDebug.addEventListener("click",()=>{
      elRawDebug.style.maxHeight = elRawDebug.style.maxHeight==="140px" ? "400px" : "140px";
    });
    document.querySelector(".camera-wrap").appendChild(elRawDebug);

    // FIX: copy-to-clipboard button, since selecting text inside a small
    // scrollable overlay is fiddly on mobile.
    elRawDebugCopyBtn = document.createElement("button");
    elRawDebugCopyBtn.textContent = "📋 Copy raw response";
    elRawDebugCopyBtn.style.cssText = "position:absolute;left:8px;right:8px;bottom:50px;padding:6px;font-size:11px;font-weight:700;border:1px solid #555;border-radius:6px;background:#222;color:#9f9;cursor:pointer;z-index:31;";
    elRawDebugCopyBtn.addEventListener("click",async(e)=>{
      e.stopPropagation();
      try{
        await navigator.clipboard.writeText(lastRawDebugText);
        elRawDebugCopyBtn.textContent = "✅ Copied!";
      }catch(_){
        // fallback: select the panel text for manual copy if clipboard API unavailable
        const r=document.createRange();
        r.selectNodeContents(elRawDebug);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(r);
        elRawDebugCopyBtn.textContent = "Selected — copy manually";
      }
      setTimeout(()=>{ elRawDebugCopyBtn.textContent = "📋 Copy"; }, 2000);
    });
    document.querySelector(".camera-wrap").appendChild(elRawDebugCopyBtn);
  }
  let text;
  try{ text = JSON.stringify(data, null, 1); }catch(_){ text = String(data); }
  lastRawDebugText = text;  // full text, uncut, for the copy button
  elRawDebug.textContent = "RAW (tap to expand):\n" + text.slice(0, 2000);
}

elDebugToggle.addEventListener("click",()=>{
  debugMode=!debugMode;
  elDebugToggle.textContent=debugMode?"🔍 ON":"🔍 OFF";
  if(!debugMode){
    elDebugList.innerHTML="";
    if(elRawDebug) elRawDebug.remove(); elRawDebug=null;
    if(elRawDebugCopyBtn) elRawDebugCopyBtn.remove(); elRawDebugCopyBtn=null;
  }
  else if(lastPreds.length) renderDebug(lastPreds);
});

// DEBUG: long-press the debug button to download the most recent captured
// frame as a real .jpg file — lets you grab the exact image the app sent
// to Roboflow without needing console access (handy on mobile).
let debugPressTimer = null;
elDebugToggle.addEventListener("touchstart",()=>{
  debugPressTimer=setTimeout(()=>{
    if(lastCapturedDataUrl){
      const a=document.createElement("a");
      a.href=lastCapturedDataUrl;
      a.download="captured-frame.jpg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  },800);
});
elDebugToggle.addEventListener("touchend",()=>clearTimeout(debugPressTimer));

// Scan button gives hitCount a boost (one tap away from confirming)
elScanBtn.addEventListener("click",()=>{
  if(elScanBtn.disabled) return;
  hitCount=CONFIRM_HITS-1;
  // FIX: the button silently adjusted internal state with zero visible
  // feedback, which made it look broken/dead on tap. Briefly show the
  // "scanning" text so the tap visibly registers, without changing what
  // the button actually does.
  setStatus("statusScanning","sending");
});

/* END GAME */
function endGame(result){
  if(gameEnded) return;
  gameEnded=true;
  clearInterval(timerInterval); timerInterval=null;
  clearTimeout(scanTimeout);    scanTimeout=null;
  stopCamera();
  elStageWin.classList.add("hidden");
  $(result==="win"?"overlay-win":"overlay-loss").classList.remove("hidden");
}

elCopyBtn.addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(FINAL_COORDS);
    elCopyBtn.textContent=tr().copiedBtn;
    setTimeout(()=>elCopyBtn.textContent=tr().copyBtn,2500);
  } catch{
    // fallback selection for browsers without clipboard API
    const r=document.createRange();
    r.selectNode(elWinCoords);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
  }
});

elRetryBtn.addEventListener("click",()=>{ elLoss.classList.add("hidden"); startGame(); });

/* MANUAL CODE */
elManualBtn.addEventListener("click",()=>{
  elManualInput.value="";
  elManualError.textContent="";
  elManualOverlay.classList.remove("hidden");
  elManualInput.focus();
});
elManualCancel.addEventListener("click",()=>elManualOverlay.classList.add("hidden"));

// also allow submitting with Enter key
elManualInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") elManualSubmit.click(); });

elManualSubmit.addEventListener("click",()=>{
  if(elManualInput.value.trim().toUpperCase()===MANUAL_CODE.toUpperCase()){
    elManualOverlay.classList.add("hidden");
    endGame("win");
  } else {
    elManualError.textContent=tr().manualError;
  }
});
</script>
</body>
