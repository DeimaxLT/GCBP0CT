<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decrypt</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.6s cubic-bezier(0.77,0,0.18,1), opacity 0.6s ease;
    }
    #page-1     { transform: translateX(0);    opacity: 1; }
    #page-1.out { transform: translateX(-110%); opacity: 0; }
    #page-2     { transform: translateX(110%);  opacity: 0; }
    #page-2.in  { transform: translateX(0);    opacity: 1; }

    .wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 28px; padding: 24px; width: min(400px, 96vw);
    }

    .heading { text-align: center; }
    .heading .lt { font-size: 0.55rem; line-height: 2.2; color: #eee; }
    .heading .en { font-size: 0.35rem; line-height: 2; color: #555; margin-top: 4px; }

    /* cells */
    .cells { display: flex; gap: 8px; }
    .cell {
      width: 48px; height: 56px;
      background: #1a1a1a; border: 2px solid #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #eee;
      position: relative; user-select: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .cell.active { border-color: #eee; }
    .cell.active::after {
      content: '_'; position: absolute; bottom: 6px;
      font-size: 0.5rem; color: #eee;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .cell.success { border-color: #4caf50; color: #4caf50; }
    .cell.error   { border-color: #e53935; color: #e53935; }

    /* status */
    .status { min-height: 36px; text-align: center; }
    .status .lt { font-size: 0.42rem; line-height: 2.4; }
    .status .en { font-size: 0.3rem; line-height: 2; color: #555; margin-top: 2px; }
    .status.err .lt { color: #e53935; }
    .status.err .en { color: #e53935; opacity: 0.7; }

    .wrap.shake { animation: shake 0.4s steps(4); }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      25%    { transform: translateX(-8px); }
      75%    { transform: translateX(8px); }
    }

    /* ── CUSTOM KEYBOARD ── */
    .keyboard {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kb-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .kb-key {
      flex: 1;
      max-width: 44px;
      height: 42px;
      background: #222;
      border: 2px solid #333;
      border-bottom: 4px solid #444;
      color: #ccc;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s, transform 0.08s, border-bottom-width 0.08s;
      border-radius: 2px;
      line-height: 1;
    }

    .kb-key:active, .kb-key.pressed {
      background: #333;
      border-bottom-width: 2px;
      transform: translateY(2px);
    }

    .kb-key.wide   { max-width: 68px; flex: 1.6; font-size: 0.35rem; }
    .kb-key.space  { max-width: 140px; flex: 3.5; }
    .kb-key.delete { max-width: 58px; flex: 1.4; font-size: 0.35rem; color: #e53935; border-color: #3a1515; border-bottom-color: #4a1c1c; }

    /* page 2 */
    .reveal { text-align: center; }
    .reveal .lt { font-size: 0.9rem; line-height: 2; color: #eee; }
    .reveal .en { font-size: 0.4rem; line-height: 2; color: #555; margin-top: 6px; }
  </style>
</head>
<body>

<div class="page" id="page-1">
  <div class="wrap" id="wrap">
    <div class="heading">
      <div class="lt">Įvesk tekstą kurį iššifravai</div>
      <div class="en">ENTER THE TEXT YOU DECODED</div>
    </div>

    <div class="cells" id="cells"></div>
    <div class="status" id="status"></div>

    <!-- Custom keyboard -->
    <div class="keyboard" id="keyboard">
      <div class="kb-row">
        <div class="kb-key" data-key="Q">Q</div>
        <div class="kb-key" data-key="W">W</div>
        <div class="kb-key" data-key="E">E</div>
        <div class="kb-key" data-key="R">R</div>
        <div class="kb-key" data-key="T">T</div>
        <div class="kb-key" data-key="Y">Y</div>
        <div class="kb-key" data-key="U">U</div>
        <div class="kb-key" data-key="I">I</div>
        <div class="kb-key" data-key="O">O</div>
        <div class="kb-key" data-key="P">P</div>
      </div>
      <div class="kb-row">
        <div class="kb-key" data-key="A">A</div>
        <div class="kb-key" data-key="S">S</div>
        <div class="kb-key" data-key="D">D</div>
        <div class="kb-key" data-key="F">F</div>
        <div class="kb-key" data-key="G">G</div>
        <div class="kb-key" data-key="H">H</div>
        <div class="kb-key" data-key="J">J</div>
        <div class="kb-key" data-key="K">K</div>
        <div class="kb-key" data-key="L">L</div>
      </div>
      <div class="kb-row">
        <div class="kb-key" data-key="Z">Z</div>
        <div class="kb-key" data-key="X">X</div>
        <div class="kb-key" data-key="C">C</div>
        <div class="kb-key" data-key="V">V</div>
        <div class="kb-key" data-key="B">B</div>
        <div class="kb-key" data-key="N">N</div>
        <div class="kb-key" data-key="M">M</div>
        <div class="kb-key delete" data-key="BACKSPACE">⌫</div>
      </div>
      <div class="kb-row">
        <div class="kb-key space" data-key=" ">SPACE</div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-2">
  <div class="wrap">
    <div class="reveal">
      <div class="lt">Metalinės durys</div>
      <div class="en">METAL DOORS</div>
    </div>
  </div>
</div>

<script>
  const PASSWORD = "TAP ME";
  const LEN = PASSWORD.length;

  const cellsEl  = document.getElementById('cells');
  const wrap     = document.getElementById('wrap');
  const status   = document.getElementById('status');
  const page1    = document.getElementById('page-1');
  const page2    = document.getElementById('page-2');

  let value  = '';
  let locked = false;
  const cells = [];

  for (let i = 0; i < LEN; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    cellsEl.appendChild(c);
    cells.push(c);
  }

  function render() {
    cells.forEach((c, i) => {
      c.textContent = value[i] || '';
      c.className = 'cell';
      if (i === value.length && value.length < LEN) c.classList.add('active');
    });
  }

  function clearStatus() {
    status.className = 'status';
    status.innerHTML = '';
  }

  function pressKey(key) {
    if (locked) return;
    if (key === 'BACKSPACE') {
      if (value.length > 0) { value = value.slice(0, -1); render(); clearStatus(); }
      return;
    }
    if (value.length < LEN && /^[A-Z ]$/.test(key)) {
      value += key;
      render();
      clearStatus();
      if (value.length === LEN) validate();
    }
  }

  // keyboard clicks — use pointerdown for instant response
  document.getElementById('keyboard').addEventListener('pointerdown', (e) => {
    const key = e.target.closest('[data-key]');
    if (!key) return;
    e.preventDefault();
    const k = key.dataset.key;
    key.classList.add('pressed');
    setTimeout(() => key.classList.remove('pressed'), 120);
    pressKey(k);
  });

  // also support physical keyboard
  document.addEventListener('keydown', (e) => {
    if (locked) return;
    if (e.key === 'Backspace') { e.preventDefault(); pressKey('BACKSPACE'); return; }
    if (e.key.length === 1) pressKey(e.key.toUpperCase());
  });

  function validate() {
    locked = true;
    if (value === PASSWORD) {
      cells.forEach((c, i) => setTimeout(() => c.className = 'cell success', i * 80));
      setTimeout(() => {
        page1.classList.add('out');
        page2.classList.add('in');
      }, LEN * 80 + 350);
    } else {
      cells.forEach(c => c.classList.add('error'));
      wrap.classList.add('shake');
      status.className = 'status err';
      status.innerHTML = '<div class="lt">Neteisingas slaptažodis</div><div class="en">INCORRECT PASSWORD</div>';
      setTimeout(() => {
        value = '';
        cells.forEach(c => c.className = 'cell');
        wrap.classList.remove('shake');
        render();
        clearStatus();
        locked = false;
      }, 1200);
    }
  }

  render();
</script>
</body>
</html>
